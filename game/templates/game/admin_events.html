{% extends 'game/base.html' %}
{% load static %}

{% block title %}Події — Мафія{% endblock %}

{% block page_css %}
<link rel="stylesheet" href="{% static 'game/css/admin_events.css' %}">
{% endblock %}

{% block content %}
<div class="events-container">
    <div class="events-title">iMafia</div>
    <div class="events-grid">
        {% for i in event_range %}
        <div class="event-card" data-event="{{ i }}">
            <div class="event-number">{{ i }}</div>
            <div class="event-name">Подія {{ i }}</div>
        </div>
        {% endfor %}
    </div>
</div>

<div class="event-detail" id="eventDetail">
    <div class="event-detail-header">
        <button class="event-detail-back" id="eventDetailBack">&#8592;</button>
        <div class="event-detail-title" id="eventDetailTitle"></div>
    </div>
    <div class="event-detail-body" id="eventDetailBody"></div>
    <div class="event-detail-footer">
        <button class="finish-event-btn" id="finishEventBtn">Закінчити подію</button>
    </div>
</div>

<script>
    const CARDS = {{ cards_json|safe }};
    const FINISH_URL = "{% url 'finish_event' %}";
</script>
{% endblock %}

{% block page_js %}
<script src="{% static 'game/js/admin_events.js' %}"></script>
{% endblock %}
