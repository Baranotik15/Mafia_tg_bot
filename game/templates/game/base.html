<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-visual">
    <title>{% block title %}Мафия{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'game/css/base.css' %}">
    {% block page_css %}{% endblock %}
    <style>
        :root {
            --bg-image: url("{% static 'game/img/bg.webp' %}");
        }
    </style>
</head>
<body>
    <div class="app">

        {% block content %}{% endblock %}

        <nav class="bottom-nav">
            <a class="nav-btn {% block nav_packs %}{% endblock %}" href="{% url 'packs' %}">
                <img src="{% static 'game/img/button/btn-packs.webp' %}" alt="Паки">
            </a>
            <a class="nav-btn {% block nav_collection %}{% endblock %}" href="{% url 'index' %}">
                <img src="{% static 'game/img/button/btn-collection.webp' %}" alt="Коллекция">
            </a>
            <a class="nav-btn {% block nav_leaders %}{% endblock %}" href="{% url 'leaders' %}">
                <img src="{% static 'game/img/button/btn-leaders.webp' %}" alt="Лидеры">
            </a>
            {% if is_admin %}
            <a class="nav-btn imafia-btn" href="{% url 'admin_events' %}"></a>
            {% endif %}
        </nav>

        <img class="bg-frame-overlay" src="{% static 'game/img/bg-frame.webp' %}" alt="">
    </div>

    <script>
        const CARD_SOUNDS = {
            'dry_win':        new Audio("{% static 'game/music/cart_sound/dry_win.mp3' %}"),
            'three_on_three': new Audio("{% static 'game/music/cart_sound/three_on_three.mp3' %}"),
            'executioner':    new Audio("{% static 'game/music/cart_sound/executioner.mp3' %}"),
            'sheriff_kill':   new Audio("{% static 'game/music/cart_sound/sheriff_kill.mp3' %}"),
            'know_the_pain':  new Audio("{% static 'game/music/cart_sound/know_the_pain.mp3' %}"),
            'handsome':        new Audio("{% static 'game/music/cart_sound/handsome.mp3' %}"),
            'Texas_Massacre':  new Audio("{% static 'game/music/cart_sound/Texas_Massacre.mp3' %}"),
        };
        let _activeCardSound = null;
        function playCardSound(slug) {
            stopCardSound();
            const snd = CARD_SOUNDS[slug];
            if (!snd) return;
            _activeCardSound = snd;
            snd.currentTime = 0;
            snd.play().catch(() => {});
        }
        function stopCardSound() {
            if (_activeCardSound) {
                _activeCardSound.pause();
                _activeCardSound.currentTime = 0;
                _activeCardSound = null;
            }
        }
        function slugFromSrc(src) {
            const m = src.match(/carts\/([^/.]+)/);
            return m ? m[1] : null;
        }
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="{% static 'game/js/base.js' %}"></script>
    {% block page_js %}{% endblock %}
</body>
</html>
