<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-visual">
    <title>{% block title %}Мафия{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'game/css/base.css' %}">
    {% block page_css %}{% endblock %}
    <style>
        :root {
            --bg-image: url("{% static 'game/img/bg.webp' %}");
        }
    </style>
</head>
<body>
    <div class="app">

        {% block content %}{% endblock %}

        <nav class="bottom-nav">
            <a class="nav-btn {% block nav_packs %}{% endblock %}" href="{% url 'packs' %}">
                <img src="{% static 'game/img/button/btn-packs.webp' %}" alt="Паки">
            </a>
            <a class="nav-btn {% block nav_collection %}{% endblock %}" href="{% url 'index' %}">
                <img src="{% static 'game/img/button/btn-collection.webp' %}" alt="Коллекция">
            </a>
            <a class="nav-btn {% block nav_leaders %}{% endblock %}" href="{% url 'leaders' %}">
                <img src="{% static 'game/img/button/btn-leaders.webp' %}" alt="Лидеры">
            </a>
            {% if is_admin %}
            <a class="nav-btn imafia-btn" href="{% url 'admin_events' %}"></a>
            {% endif %}
        </nav>

        <img class="bg-frame-overlay" src="{% static 'game/img/bg-frame.webp' %}" alt="">
    </div>

    <script>
        (function() {
            var srcs = [
                "{% static 'game/img/carts/executioner.webp' %}",
                "{% static 'game/img/carts/dry_win.webp' %}",
                "{% static 'game/img/carts/sheriff_kill.webp' %}",
                "{% static 'game/img/carts/three_on_three.webp' %}",
                "{% static 'game/img/carts/know_the_pain.webp' %}",
                "{% static 'game/img/carts/handsome.webp' %}",
                "{% static 'game/img/carts/Texas_Massacre.webp' %}",
                "{% static 'game/img/carts/finally.webp' %}",
                "{% static 'game/img/carts/without_blast.webp' %}",
                "{% static 'game/img/carts/shot_in_the_knee.webp' %}",
                "{% static 'game/img/carts/for_distribution.webp' %}",
                "{% static 'game/img/carts/triplet.webp' %}",
                "{% static 'game/img/carts/third_wheel.webp' %}",
                "{% static 'game/img/carts/Three_in_a_row.webp' %}",
                "{% static 'game/img/carts/friendly_fire.webp' %}",
                "{% static 'game/img/carts/wholesale_offer.webp' %}",
                "{% static 'game/img/carts/stormed.webp' %}",
                "{% static 'game/img/carts/3_finger_armor.webp' %}",
                "{% static 'game/img/carts/lector.webp' %}",
                "{% static 'game/img/carts/on_the_teeth.webp' %}",
            ];
            srcs.forEach(function(src) { (new Image()).src = src; });
        })();
    </script>
    <script>
        const CARD_SOUNDS = {
            'dry_win':        new Audio("{% static 'game/music/cart_sound/dry_win.mp3' %}"),
            'three_on_three': new Audio("{% static 'game/music/cart_sound/three_on_three.mp3' %}"),
            'executioner':    new Audio("{% static 'game/music/cart_sound/executioner.mp3' %}"),
            'sheriff_kill':   new Audio("{% static 'game/music/cart_sound/sheriff_kill.mp3' %}"),
            'know_the_pain':  new Audio("{% static 'game/music/cart_sound/know_the_pain.mp3' %}"),
            'handsome':        new Audio("{% static 'game/music/cart_sound/handsome.mp3' %}"),
            'Texas_Massacre':  new Audio("{% static 'game/music/cart_sound/Texas_Massacre.mp3' %}"),
            'finally':         new Audio("{% static 'game/music/cart_sound/finally.mp3' %}"),
            'without_blast':      new Audio("{% static 'game/music/cart_sound/without_blast.mp3' %}"),
            'shot_in_the_knee':   new Audio("{% static 'game/music/cart_sound/shot_in_the_knee.mp3' %}"),
            'for_distribution':   new Audio("{% static 'game/music/cart_sound/for_distribution.mp3' %}"),
            'triplet':            new Audio("{% static 'game/music/cart_sound/triplet.mp3' %}"),
            'third_wheel':        new Audio("{% static 'game/music/cart_sound/third_wheel.mp3' %}"),
            'Three_in_a_row':     new Audio("{% static 'game/music/cart_sound/Three_in_a_row.mp3' %}"),
            'friendly_fire':      new Audio("{% static 'game/music/cart_sound/friendly_fire.mp3' %}"),
            'wholesale_offer':    new Audio("{% static 'game/music/cart_sound/wholesale_offer.mp3' %}"),
            'stormed':            new Audio("{% static 'game/music/cart_sound/stormed.mp3' %}"),
            '3_finger_armor':     new Audio("{% static 'game/music/cart_sound/3_finger_armor.mp3' %}"),
            'lector':             new Audio("{% static 'game/music/cart_sound/lector.mp3' %}"),
            'on_the_teeth':       new Audio("{% static 'game/music/cart_sound/on_the_teeth.mp3' %}"),
        };
        let _activeCardSound = null;
        function playCardSound(slug) {
            stopCardSound();
            const snd = CARD_SOUNDS[slug];
            if (!snd) return;
            _activeCardSound = snd;
            snd.currentTime = 0;
            snd.play().catch(() => {});
        }
        function stopCardSound() {
            if (_activeCardSound) {
                _activeCardSound.pause();
                _activeCardSound.currentTime = 0;
                _activeCardSound = null;
            }
        }
        function slugFromSrc(src) {
            const m = src.match(/carts\/([^/.]+)/);
            return m ? m[1] : null;
        }
    </script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="{% static 'game/js/base.js' %}"></script>
    {% block page_js %}{% endblock %}
</body>
</html>
