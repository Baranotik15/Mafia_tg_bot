services:
  bot:
    build: .
    command: python bot.py
    env_file: .env
    restart: unless-stopped

  web:
    build: .
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn mafia_web.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    env_file: .env
    volumes:
      - static_files:/app/staticfiles
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_files:/static:ro
    depends_on:
      - web
    restart: unless-stopped

volumes:
  static_files:
