server {
    listen 80;
    server_name redcrab.casa www.redcrab.casa;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name redcrab.casa www.redcrab.casa;

    ssl_certificate /etc/letsencrypt/live/redcrab.casa/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redcrab.casa/privkey.pem;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location ~* ^/static/.*\.(js|css)$ {
        root /;
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
        access_log off;
    }

    location ~* ^/static/.*\.(png|jpg|jpeg|gif|ico|webp|woff2?)$ {
        root /;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /static/ {
        alias /static/;
        access_log off;
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
